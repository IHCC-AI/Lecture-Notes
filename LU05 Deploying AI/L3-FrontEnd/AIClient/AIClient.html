<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Simple Ollama Chat</title>
        <style>
            body {
                max-width: 600px;
                margin: 30px auto;
            }

            #chat {
                height: 400px;
                border: 1px solid #ccc;
                overflow-y: auto;
                padding: 12px;
                margin-bottom: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .msg {
                padding: 8px 12px;
                border-radius: 6px;
                max-width: 80%;
                white-space: pre-wrap;
                word-wrap: break-word;
            }

            .user {
                align-self: flex-end;
                background: #007bff;
                color: white;
            }

            .ai {
                align-self: flex-start;
                background: #e9ecef;
                color: #212529;
            }

            .input-box {
                display: flex;
                gap: 8px;
            }

            input {
                flex: 1;
                border: 1px solid #ccc;
            }

            button {
                padding: 10px 18px;
                background: #007bff;
                color: white;
            }

            /* Markdown inner styling */
            .msg p {
                margin: 0 0 8px 0;
            }
            .msg p:last-child {
                margin-bottom: 0;
            }
            .msg code {
                background: rgba(0, 0, 0, 0.08);
                padding: 2px 5px;
                border-radius: 4px;
                font-family: monospace;
                font-size: 0.9em;
            }
            .msg pre {
                background: #282c34;
                color: #abb2bf;
                padding: 10px;
                border-radius: 6px;
                overflow-x: auto;
                margin: 8px 0;
            }
            .msg pre code {
                background: none;
                padding: 0;
                color: inherit;
            }
            .msg ul,
            .msg ol {
                margin: 4px 0 8px 20px;
                padding: 0;
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body>
        <h2>Ollama Chat</h2>
        <div id="chat"></div>

        <div class="input-box">
            <input
                type="text"
                id="prompt"
                placeholder="Type a message..."
                onkeydown="if (event.key === 'Enter') send();"
            />
            <button id="sendBtn" onclick="send()">Send</button>
        </div>

        <script>
            // Change Model and Ports as needed
            const OLLAMA_HOST = 'http://localhost';
            const PORT = '11434';
            const MODEL_NAME = 'qwen3.5:2b';

            const chat = document.getElementById('chat');
            const promptInput = document.getElementById('prompt');
            const sendBtn = document.getElementById('sendBtn');

            function addMessage(sender, text) {
                const msg = document.createElement('div');
                msg.className = `msg ${sender}`;
                msg.textContent = text;
                chat.appendChild(msg);
                chat.scrollTop = chat.scrollHeight;
                return msg;
            }

            async function send() {
                const text = promptInput.value.trim();
                if (!text) return;

                addMessage('user', text);
                promptInput.value = '';
                sendBtn.disabled = true;

                const aiMsg = addMessage('ai', 'Thinking...');

                try {
                    const response = await fetch(
                        `${OLLAMA_HOST}:${PORT}/api/generate`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                model: MODEL_NAME,
                                prompt: text,
                                stream: false,
                            }),
                        },
                    );

                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! Status: ${response.status}`,
                        );
                    }

                    const data = await response.json();
                    aiMsg.innerHTML = marked.parse(data.response);
                } catch (err) {
                    aiMsg.textContent = 'Error: ' + err.message;
                } finally {
                    sendBtn.disabled = false;
                    promptInput.focus();
                }
            }
        </script>
    </body>
</html>
