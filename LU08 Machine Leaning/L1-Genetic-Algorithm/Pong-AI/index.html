<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pong AI - p5.js + Neataptic</title>
        <link rel="stylesheet" href="style.css" />
        <!-- p5.js Library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
        <!-- Neataptic JS Library for NEAT AI -->
        <script src="https://cdn.jsdelivr.net/npm/neataptic@1.4.7/dist/neataptic.min.js"></script>
        <!-- Our Custom JavaScript -->
        <script src="script.js" defer type="module"></script>
    </head>
    <body>
        <header>
            <h1>Pong AI</h1>
            <p>
                <a href="https://en.wikipedia.org/wiki/Neuroevolution"
                    >Neuroevolution</a
                >
                Simulator
            </p>
        </header>
        <main>
            <section id="dashboard" aria-label="Simulation controls and stats">
                <table id="status" aria-label="Simulation statistics">
                    <thead>
                        <tr>
                            <th scope="col">Generation</th>
                            <th scope="col">Alive</th>
                            <th scope="col">High score</th>
                            <th scope="col">Best bounces</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="hudGen">1</td>
                            <td id="hudAlive">30 / 30</td>
                            <td id="hudHighScore">0</td>
                            <td id="hudBestBounces">0</td>
                        </tr>
                    </tbody>
                </table>
                <div id="speedControl">
                    <label id="speedVal" for="speedSlider">Speed: 1x</label>
                    <input
                        type="range"
                        id="speedSlider"
                        min="1"
                        max="20"
                        value="1"
                    />
                </div>
                <button id="btnReset" type="button">Reset AI</button>
            </section>

            <div id="canvas-container" aria-label="Pong simulation"></div>

            <section id="guide">
                <h2>AI inputs and scoring</h2>
                <ul>
                    <li>
                        Inputs (5): ball position, ball velocity, and paddle
                        position.
                    </li>
                    <li>Outputs (2): move up or move down.</li>
                    <li>
                        Fitness: +0.1 per frame alive and +500 per successful
                        return.
                    </li>
                </ul>
            </section>
        </main>
    </body>
</html>
